<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #f2f7ff, #fef8f2);
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        .card {
            background: #ffffff;
            width: min(92vw, 460px);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 16px;
            font-size: 1.6rem;
            color: #1f2a44;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            border: 0;
            background: #2563eb;
            color: white;
            padding: 11px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .hint {
            margin-top: 10px;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>User Registration</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" action="{% url 'success' %}">
            {% csrf_token %}

            <label for="username">UserName (required)</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                value="{{ username|default:'' }}"
                required
            >

            <label for="password">Password (optional)</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                value="{{ password|default:'' }}"
            >

            <label for="email">Email id (optional)</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="name@example.com"
                value="{{ email|default:'' }}"
            >

            <label for="contact">Contact Number (optional)</label>
            <input
                type="tel"
                id="contact"
                name="contact"
                placeholder="Enter contact number"
                value="{{ contact|default:'' }}"
            >

            <button type="submit">Submit</button>
            <p class="hint">Only UserName is compulsory as requested.</p>
        </form>
    </main>
</body>
</html>
