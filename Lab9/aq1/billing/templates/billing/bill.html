<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .box {
            width: 460px;
            border: 1px solid #999;
            padding: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th,
        td {
            border: 1px solid #bbb;
            padding: 6px;
            text-align: left;
            font-size: 14px;
        }

        .total {
            margin-top: 10px;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div><strong>Brand:</strong> {{ brand }}</div>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Unit Price</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody>
                {% for row in line_items %}
                    <tr>
                        <td>{{ row.item }}</td>
                        <td>{{ row.unit_price }}</td>
                        <td>{{ row.quantity }}</td>
                        <td>{{ row.amount }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="total">Total Amount: {{ total_amount }}</div>
        <a href="{% url 'order' %}">Back</a>
    </div>
</body>
</html>
