{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Book Management{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-container">
            <h1><a href="{% url 'index' %}">Book Management System</a></h1>
            <ul class="nav-links">
                <li><a href="{% url 'index' %}">Home</a></li>
                <li><a href="{% url 'author_list' %}">Authors</a></li>
                <li><a href="{% url 'publisher_list' %}">Publishers</a></li>
                <li><a href="{% url 'book_list' %}">Books</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>&copy; 2026 Book Management System</p>
    </footer>
</body>
</html>
