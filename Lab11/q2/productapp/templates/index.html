<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>
<h1>Product Management</h1>
<p><a href="/">Home</a> | <a href="/add/">Add Product</a></p>

<h2>Products</h2>

{% if products %}
<ul>
    {% for product in products %}
    <li>
        <strong>{{ product.title }}</strong> - ${{ product.price }}
        <br>
        {{ product.description }}
    </li>
    {% endfor %}
</ul>
{% else %}
<p>No products found. <a href="/add/">Add your first product</a></p>
{% endif %}

<hr>
<p>&copy; 2026 Product Management System</p>
</body>
</html>
