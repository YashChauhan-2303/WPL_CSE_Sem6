<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .box {
            width: 320px;
            border: 1px solid #999;
            padding: 14px;
        }

        .row {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 95px;
            font-size: 14px;
        }

        input {
            width: 190px;
            padding: 4px;
            font-size: 14px;
        }

        button {
            padding: 5px 12px;
            font-size: 14px;
        }

        .errorlist {
            color: #b00020;
            margin: 0 0 8px 0;
            padding-left: 18px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="box">
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="row">
                <label for="id_name">Name</label>
                {{ form.name }}
                {{ form.name.errors }}
            </div>

            <div class="row">
                <label for="id_total_marks">Total Marks</label>
                {{ form.total_marks }}
                {{ form.total_marks.errors }}
            </div>

            <button type="submit">Calculate</button>
        </form>
    </div>
</body>
</html>
